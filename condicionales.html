<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label>Edad:</label>
    <input type="text" name="edad" id="edad" placeholder="Escribe tu edad en número">
    <button onclick="evaluar()">Evaluar</button>


    <script>
        function evaluar(){
            let edad = document.getElementById("edad").value

            if(edad == ""){
                alert("Debes ingresar un valor")
                return
            }
            if (edad > 0 && edad <18){
                alert("Eres menor de edad")
            }
            else if (edad >= 18 && edad < 60 ) {
                alert("Eres mayor de edad")
            } 
            else if(edad >= 60 && edad < 105){
                alert("Eres un adulto mayor")
            }
            else{
                alert("No es valido ese rango de edad")
            }
               
        }

    </script>
</body>
</html>
